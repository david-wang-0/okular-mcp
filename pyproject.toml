[project]
name = "okular-mcp"
version = "0.1.0"
description = "MCP server telling an LLM what you are reading in the Okular PDF viewer: open documents and pages, your text selection, and goto; plus a Claude Code prompt hook."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "David Wang" }]
keywords = ["mcp", "okular", "pdf", "kde", "dbus", "claude-code", "hook"]
classifiers = [
  "Environment :: X11 Applications :: KDE",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]
dependencies = [
  "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/david-wang-0/okular-mcp"

[project.scripts]
okular-mcp = "okular_mcp.server:main"
okular-mcp-hook = "okular_mcp.hook:main"
okular-mcp-open = "okular_mcp.open:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okular_mcp"]

[tool.coverage.run]
branch = true
source = ["okular_mcp"]
# Also measure the server, hook and okular-mcp-open processes the tests start.
patch = ["subprocess"]
